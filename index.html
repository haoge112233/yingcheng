<!DOCTYPE html>
<html>
<head>
    <title>手机网盘测试</title>
    <style>
        body { font-family: Arial; padding: 40px; }
        .box { border: 2px solid #4CAF50; padding: 30px; max-width: 500px; margin: 0 auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { background: #4CAF50; color: white; padding: 12px 24px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>📱 手机私密网盘测试</h2>
        
        <input type="text" id="server" placeholder="服务器地址" 
               value="http://192.168.10.8:8888">
        <br>
        <input type="password" id="password" placeholder="密码" value="admin123">
        <br>
        <button onclick="login()">🔑 登录测试</button>
        
        <div id="result" style="margin-top: 20px;"></div>
    </div>

    <script>
        async function login() {
            const server = document.getElementById('server').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('result');
            
            result.innerHTML = '🔄 连接中...';
            result.style.color = '#666';
            
            try {
                const response = await fetch(server + '/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: password})
                });
                
                if (response.ok) {
                    const data = await response.json();
                    result.innerHTML = `
                        ✅ <b>连接成功！</b><br>
                        👤 用户: ${data.user.username}<br>
                        🔑 令牌: ${data.token.substring(0, 30)}...<br>
                        📁 存储: ${data.server_info.storage_path}
                    `;
                    result.style.color = 'green';
                } else {
                    const error = await response.text();
                    result.innerHTML = `❌ 登录失败: ${error}`;
                    result.style.color = 'red';
                }
            } catch (e) {
                result.innerHTML = `❌ 连接失败: ${e.message}`;
                result.style.color = 'red';
            }
        }
        
        // 自动测试
        window.onload = function() {
            setTimeout(login, 1000);
        };
    </script>
</body>
</html>
