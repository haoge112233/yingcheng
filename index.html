<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人云存储 - 樱橙网盘</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-left">
            <i class="fas fa-cloud nav-logo"></i>
            <span class="nav-title">GitDrive</span>
            <div class="breadcrumb">
                <a href="#" class="breadcrumb-home">我的网盘</a>
                <span id="current-path">/</span>
            </div>
        </div>
        <div class="nav-right">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="搜索文件...">
            </div>
            <div class="user-menu">
                <img id="user-avatar" src="https://ui-avatars.com/api/?name=User&background=4A90E2&color=fff" alt="头像">
                <span id="username">未登录</span>
                <div class="dropdown-menu">
                    <a href="#profile"><i class="fas fa-user"></i>个人资料</a>
                    <a href="#settings"><i class="fas fa-cog"></i>设置</a>
                    <a href="#storage"><i class="fas fa-hdd"></i>存储空间</a>
                    <div class="divider"></div>
                    <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i>退出登录</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-section">
            <h3>操作</h3>
            <button class="btn-primary" id="upload-btn">
                <i class="fas fa-cloud-upload-alt"></i>上传文件
            </button>
            <button class="btn-secondary" id="new-folder-btn">
                <i class="fas fa-folder-plus"></i>新建文件夹
            </button>
            <button class="btn-secondary" id="share-btn">
                <i class="fas fa-share-alt"></i>分享文件
            </button>
        </div>
        
        <div class="sidebar-section">
            <h3>快捷访问</h3>
            <ul class="sidebar-menu">
                <li class="active"><i class="fas fa-home"></i>我的文件</li>
                <li><i class="fas fa-clock"></i>最近访问</li>
                <li><i class="fas fa-star"></i>收藏夹</li>
                <li><i class="fas fa-share-square"></i>与我分享</li>
                <li><i class="fas fa-trash"></i>回收站</li>
            </ul>
        </div>
        
        <div class="sidebar-section">
            <h3>存储空间</h3>
            <div class="storage-info">
                <div class="storage-bar">
                    <div class="storage-fill" style="width: 35%"></div>
                </div>
                <p>已使用 <span class="storage-used">3.5 GB</span> / <span class="storage-total">10 GB</span></p>
            </div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="view-toggle">
                <button class="view-btn active" data-view="grid">
                    <i class="fas fa-th-large"></i>
                </button>
                <button class="view-btn" data-view="list">
                    <i class="fas fa-list"></i>
                </button>
            </div>
            <div class="toolbar-actions">
                <button class="toolbar-btn" id="select-all"><i class="far fa-square"></i> 全选</button>
                <button class="toolbar-btn" id="download-btn"><i class="fas fa-download"></i> 下载</button>
                <button class="toolbar-btn" id="delete-btn"><i class="fas fa-trash"></i> 删除</button>
                <button class="toolbar-btn" id="refresh-btn"><i class="fas fa-sync-alt"></i> 刷新</button>
            </div>
        </div>

        <!-- 文件列表 -->
        <div class="file-list" id="file-list">
            <!-- 动态加载文件列表 -->
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>
        </div>

        <!-- 上传区域 -->
        <div class="upload-area" id="upload-area">
            <i class="fas fa-cloud-upload-alt fa-3x"></i>
            <p>拖拽文件到此处上传</p>
            <p class="upload-hint">或点击选择文件</p>
            <input type="file" id="file-input" multiple style="display: none;">
        </div>

        <!-- 上传进度条 -->
        <div class="upload-progress" id="upload-progress">
            <div class="progress-header">
                <h4>正在上传</h4>
                <button id="close-progress">&times;</button>
            </div>
            <div class="progress-list" id="progress-list"></div>
        </div>
    </main>

    <!-- 预览侧边栏 -->
    <div class="preview-sidebar" id="preview-sidebar">
        <div class="preview-header">
            <h3 id="preview-title">文件预览</h3>
            <button id="close-preview">&times;</button>
        </div>
        <div class="preview-content" id="preview-content">
            <div class="no-preview">
                <i class="fas fa-file fa-3x"></i>
                <p>选择文件进行预览</p>
            </div>
        </div>
    </div>

    <!-- 上传文件输入 -->
    <input type="file" id="file-selector" multiple style="display:none;">

    <script src="script.js"></script>
</body>
                </html>
